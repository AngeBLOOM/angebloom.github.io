<style>/* «Español para…» · la misma piel Aurora que los siete cursos, en pequeño */
:root{--brand:#FF5E3A; --au2:#7C3AED; --au3:#0EA5E9; --ground:#0C0A12; --surface:#16121F; --ink:#F4EFFA; --ink-2:#C2B8D2; --ink-3:#8F84A3;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.085); --glass-line:rgba(255,255,255,.11); --line:rgba(255,255,255,.1);
  --ok:#3FD9A6; --bad:#FF7A5C; --gold:#F0C260;
  --au-grad:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 45%,#8B5CF6));
  --au-glow:0 10px 30px -8px color-mix(in srgb,var(--brand) 75%,transparent);
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --thai:"Noto Sans Thai Looped","Leelawadee UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background:var(--ground);color:var(--ink);font:16px/1.55 var(--thai);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.es{font-family:var(--ui);font-weight:700;letter-spacing:-.01em}
.tm-th{font-family:var(--thai)}
h1{font:800 30px/1.15 var(--thai);margin:6px 0 6px;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--ink) 30%,color-mix(in srgb,var(--brand) 70%,var(--ink)) 70%,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:700 20px var(--thai);margin:0}
.lede{color:var(--ink-2);margin:0 0 14px}
#aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#aurora i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.8}
#aurora i:nth-child(1){width:60vmax;height:60vmax;left:-18vmax;top:-24vmax;background:radial-gradient(circle,var(--brand),transparent 65%);animation:m1 22s ease-in-out infinite}
#aurora i:nth-child(2){width:52vmax;height:52vmax;right:-20vmax;top:-10vmax;background:radial-gradient(circle,var(--au2),transparent 65%);animation:m2 26s ease-in-out infinite}
#aurora i:nth-child(3){width:46vmax;height:46vmax;left:20vmax;bottom:-30vmax;background:radial-gradient(circle,var(--au3),transparent 65%);opacity:.5;animation:m1 30s ease-in-out infinite reverse}
#aurora .suelo{position:absolute;left:-50%;right:-50%;bottom:-8vh;height:55vh;opacity:.5;
  background-image:linear-gradient(to right,rgba(56,189,248,.5) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(168,85,247,.5) 1.5px,transparent 1.5px);
  background-size:64px 64px;transform:perspective(320px) rotateX(68deg);transform-origin:50% 100%;
  -webkit-mask:linear-gradient(to top,#000 10%,transparent 85%);mask:linear-gradient(to top,#000 10%,transparent 85%);animation:suelo 3.2s linear infinite}
#aurora::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(99,102,241,.3),inset 0 0 0 1px rgba(139,92,246,.3)}
@keyframes m1{50%{transform:translate(6vmax,4vmax) scale(1.12)}}
@keyframes m2{50%{transform:translate(-5vmax,6vmax) scale(.92)}}
@keyframes suelo{to{background-position:0 0,0 64px}}
#arriba{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:color-mix(in srgb,var(--ground) 72%,transparent);border-bottom:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#arriba .marca{flex:1;font:800 15px var(--thai)}
.chip{font:700 13px var(--ui);padding:5px 9px;border-radius:99px;background:var(--glass-2);border:1px solid var(--glass-line)}
.arr-av,.sin{border:0;background:none;padding:0;cursor:pointer}
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 14px -2px var(--brand)}
.av img{width:100%;height:100%;object-fit:cover}
main{max-width:720px;margin:0 auto;padding:16px 16px 130px}
#abajo{position:fixed;z-index:44;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;padding:7px 6px;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 0 0 1px rgba(139,92,246,.25),0 0 30px -6px rgba(99,102,241,.55),0 18px 40px -16px rgba(0,0,0,.6);max-width:700px;margin:0 auto}
#abajo button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--ink-3);padding:4px 2px;cursor:pointer;font-size:11px}
#abajo button span{font-size:20px;filter:grayscale(1) brightness(1.4)}
#abajo button b{font-weight:600}
#abajo button[aria-current="true"]{color:var(--ink)}
#abajo button[aria-current="true"] span{filter:drop-shadow(0 0 8px var(--brand))}
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 0 22px -10px rgba(56,189,248,.45),0 14px 34px -18px rgba(0,0,0,.9);padding:14px}
button.card{cursor:pointer;text-align:left;width:100%;transition:transform .15s cubic-bezier(.3,1.5,.5,1)}
button.card:active{transform:scale(.97)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-line);background:var(--glass-2);color:var(--ink);padding:10px 16px;border-radius:14px;cursor:pointer;font-weight:600;transition:transform .14s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.4}
.btn-p,.btn--p{background:var(--au-grad) !important;border-color:transparent !important;color:#fff !important;box-shadow:var(--au-glow)}
.btn-s,.btn--s{padding:6px 11px;font-size:13px}
.btn--lg{padding:13px 22px}
.iconbtn,.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass-2);color:var(--ink);cursor:pointer;flex:none}
.sonando{animation:late 1s ease-out}
@keyframes late{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.muted,.nota{color:var(--ink-3);font-size:13.5px}
.row,.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fila{justify-content:center;margin-top:12px}
.tit{font:700 12px var(--thai);letter-spacing:.08em;color:var(--ink-3);margin:20px 4px 8px}
.bar{height:7px;border-radius:99px;background:var(--glass-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--au-grad);border-radius:99px}
.pop{animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.vista>*{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
/* inicio */
.cab{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cab-yo{flex:1;min-width:0}.cab-yo b{display:block;font-size:17px}.cab-yo small{color:var(--ink-3)}
.cab-racha{text-align:center;padding:6px 10px;border-radius:14px;background:var(--glass-2)}
.cab-racha b{display:block;filter:grayscale(1);opacity:.6}.cab-racha.on b{filter:none;opacity:1}
.cab-racha small{font-size:11px;color:var(--ink-3)}
.play{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-bottom:12px;border-color:color-mix(in srgb,#34A853 45%,transparent)}
.play b{display:block}.play small{color:var(--ink-3)}
.play-l{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#00D7FE,#00F076 40%,#FFD500 70%,#FF3A44);flex:none}
.bienvenida{color:var(--ink-2)}
.sigue{display:flex;align-items:center;gap:12px}.sigue b{display:block}.sigue small{color:var(--ink-3)}.sigue .ir{margin-left:auto;color:var(--brand);font-size:20px}
.accesos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc{display:flex;flex-direction:column;gap:2px}.acc span{font-size:26px}.acc small{color:var(--ink-3);font-size:12px}
/* la del día */
.dd{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px 14px;border-radius:22px;border:1.5px solid color-mix(in srgb,var(--brand) 45%,var(--line));
  background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 12%,transparent),var(--glass))}
.dd.hecha{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.dd-dib{font-size:36px}.dd-dib .ico,.dib-m .ico,.dib-s .ico,.dib-g .ico{width:1em;height:1em}
.dd-tx{flex:1;min-width:0}.dd-tx small{display:block;font-size:11.5px;color:var(--brand);font-weight:700}
.dd.hecha .dd-tx small{color:var(--ok)}
.dd-tx b{font-size:22px;cursor:pointer;display:block}.dd-tx em{font-style:normal;color:var(--ink-2);font-size:14px}
#modal{position:fixed;inset:0;z-index:90;background:rgba(6,4,12,.6);display:grid;place-items:center;padding:14px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal[hidden]{display:none}
.caja,.dd-caja{position:relative;width:min(540px,100%);max-height:92vh;overflow:auto;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--glass-line);border-radius:22px;padding:18px}
.dd-modal{position:fixed;inset:0;z-index:90;background:rgba(6,4,12,.6);display:grid;place-items:center;padding:14px}
.dd-modal[hidden]{display:none}
.x{position:absolute;top:8px;right:12px;border:0;background:none;font-size:28px;color:var(--ink-3);cursor:pointer}
.eti{color:var(--brand);font-weight:700;font-size:12px}
.dd-cab{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
.dd-cab b{font-size:20px}.fase{display:block;color:var(--brand);font-size:13px;font-weight:700}
.dib-m{font-size:50px}.dib-s{font-size:30px}.dib-g{font-size:110px;line-height:1}
.num{font:800 1em var(--ui);color:var(--ink)}
.huecos{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:8px 0 16px;font:700 32px var(--ui)}
.huecos.frase{font-size:22px}
.hueco{min-width:1.3em;height:1.6em;display:grid;place-items:center;border-bottom:3px solid var(--line);border-radius:6px;background:var(--glass);padding:0 4px}
.hueco.guia{opacity:.4}.hueco.puesta{border-color:var(--ok);box-shadow:0 0 16px -4px var(--ok);animation:pon .3s}
@keyframes pon{from{transform:scale(1.4)}to{transform:none}}
.sep{opacity:.5}
.fichas{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;font:700 26px var(--ui)}
.fichas.frase{font-size:19px}
.ficha{min-width:56px;height:56px;padding:0 10px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass-2);cursor:pointer;box-shadow:0 4px 0 rgba(255,255,255,.12)}
.ficha:active{transform:translateY(3px);box-shadow:none}
.ficha.usada{opacity:0;pointer-events:none}.ficha.mal{animation:mal .4s;border-color:var(--bad)}
@keyframes mal{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{text-align:center;margin-top:14px}.ok,.okt{color:var(--ok);font-weight:700}.not{color:var(--bad);font-weight:700}
.fuego{font-size:22px;margin:6px 0}
/* palabras */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tema{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center !important}
.tema.ok{background:color-mix(in srgb,var(--ok) 9%,var(--glass))}
.tema-dibs{display:flex;gap:4px;min-height:40px;align-items:center}
.estrellas i{font-style:normal;filter:grayscale(1);opacity:.3;font-size:13px}.estrellas i.si{filter:none;opacity:1}
.tm-cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.paso{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;border:1.5px solid var(--glass-line);background:var(--glass);color:var(--ink-2);font-size:12px;cursor:pointer}
.paso i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px}
.paso.aqui{border-color:var(--brand);color:var(--ink);font-weight:700}
.paso.hecho i{background:var(--ok);border-color:var(--ok);color:#fff}
.puntos{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.puntos i{width:9px;height:9px;border-radius:50%;background:var(--line)}.puntos i.v{background:color-mix(in srgb,var(--brand) 45%,var(--line))}.puntos i.a{background:var(--brand);transform:scale(1.35)}
.tarjeta{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:420px;margin:0 auto;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 9%,transparent),var(--glass))}
.grande{font-size:40px}
.tarjeta .tm-th{font-size:19px;color:var(--ink-2)}
.quiz{text-align:center}.qprog{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}.qprog .bar{flex:1;margin:0}
.q{font-weight:700;margin:12px 0 8px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass-2);cursor:pointer}
.op small{color:var(--ink-2)}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent);box-shadow:0 0 22px -6px var(--ok)}
.op.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);animation:mal .4s}
.centro{text-align:center}.pc{font:800 48px var(--ui)}
.fin{text-align:center;padding:16px 6px}.fin-e{font-size:50px}
/* frases y sonidos */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:4px}
.chipb{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink-2);cursor:pointer}
.chipb.si{background:var(--au-grad);color:#fff;border-color:transparent;box-shadow:var(--au-glow)}
.frase{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}
.frase span{flex:1}.frase b{display:block;font-size:18px}.frase small{color:var(--ink-2)}
.estrella{border:0;background:none;font-size:22px;color:var(--ink-3);cursor:pointer}.estrella.si{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.sonido{margin-bottom:10px}.son-cab{display:flex;align-items:center;gap:10px}.son-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--au-grad);color:#fff;font:800 13px var(--ui)}
.sonido p{color:var(--ink-2);margin:8px 0}
.ejs{display:flex;flex-wrap:wrap;gap:6px}.ej{border:1px solid var(--glass-line);background:var(--glass-2);border-radius:12px;padding:6px 10px;cursor:pointer;font-size:16px}
/* perfil */
.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);margin-top:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--glass-2);border:1px solid var(--glass-line);border-radius:12px;padding:10px 12px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.avb{aspect-ratio:1;border-radius:50%;border:2px solid transparent;font-size:24px;cursor:pointer}.avb.si{border-color:#fff;box-shadow:0 0 14px var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stats .card{text-align:center}.stats b{display:block;font-size:19px}.stats small{color:var(--ink-3);font-size:11.5px}
/* compañeros, con los nombres de clase del motor grande */
.vhead h1{margin-top:0}.eyebrow{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.06em}
/* aviso y confeti */
#aviso{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;z-index:95;display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:16px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--glass-line);transition:.25s;pointer-events:none;max-width:90vw}
#aviso.ver{opacity:1;transform:translate(-50%,0)}#aviso .av-e{font-size:22px}#aviso b{display:block}#aviso em{font-style:normal;font-size:13px;color:var(--ink-2)}
.confeti{position:fixed;width:8px;height:12px;border-radius:2px;z-index:99;pointer-events:none;animation:confeti 1.3s ease-out forwards}
@keyframes confeti{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media (max-width:520px){.pasos{grid-template-columns:repeat(2,1fr)}.avs{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){#aurora i,#aurora .suelo,.vista>*{animation:none !important}}

/* los dibujos de línea de dibujos.js (copiado de part1.html) */
.ico{
  width:1em; height:1em; display:inline-block; vertical-align:-.13em;
  fill:none; stroke:currentColor; stroke-width:2.6;
  stroke-linecap:round; stroke-linejoin:round; overflow:visible;
}
/* Los dibujos hechos a mano ocupan la misma caja, pero traen su propio
   color: no siguen al texto como los de linea, asi que no heredan ni el
   trazo ni el relleno. */
img.ico-arte{object-fit:contain; vertical-align:-.18em; stroke:none; fill:none}
.ico .a{stroke:var(--brand)}
.ico .af{fill:var(--brand); stroke:none}
.ico .f{fill:currentColor; stroke:none}
.ico{color:var(--ink)}
#arriba .lengua{font-size:22px;line-height:1;text-decoration:none;width:38px;height:38px;display:grid;place-items:center;
  border-radius:12px;background:var(--glass-2);border:1px solid var(--glass-line)}

   Hasta ahora cada palabra salía con un emoji. El emoji tiene dos
   problemas para aprender: lo dibuja cada sistema a su manera (no es el
   mismo en un móvil que en un ordenador, así que la imagen que se te
   queda grabada cambia según dónde estudies) y a tamaño grande se ve
   mal. Estos son dibujos de línea, iguales en todas partes, que crecen
   sin romperse y que se pintan del color del texto, así que funcionan
   igual en claro y en oscuro.

   Van en el mismo tablero de 48 × 48 y con el mismo grosor de trazo,
   para que la colección parezca una colección y no un cajón de sastre.
   Lo que no tiene dibujo propio sigue saliendo con su emoji de antes:
   más vale un emoji que un cuadrado vacío.

   Las claves son palabras en castellano, las mismas que ya usaba
   DIBUJO_PALABRAS, así que esto no añade material de ningún idioma al
   motor (ver verificar.js).

   El <svg> mide 1 em, de modo que hereda el tamaño del sitio donde se
   meta y no hay que tocar ni una caja de las que ya había.

   Va después de part3.js (usa nada) y antes de vida.js (que es quien
   tiene «dibujo»). */

Object.keys(COLORES).forEach(k => {

});

/* Un emoji lo dibuja cada sistema a su manera; estos no. Lo que no
   tenga dibujo propio sigue con su emoji, que es mejor que nada. */
function ilustracion(clave){
  if(!clave) return null;
  const k = SINONIMO[clave] || clave;
  /* Si la palabra tiene dibujo hecho a mano, ese manda. Va en la misma
     caja de 1 em que el de linea, asi que entra donde ya habia un dibujo
     sin tocar ninguna pantalla. Lo pone build.js con el manifest de
     arte-palabras; si no hay, ARTE queda vacio y esto ni se entera. */
  if(typeof ARTE !== "undefined" && ARTE && ARTE[k])
    return `<img class="ico ico-arte" src="./dibujos/${ARTE[k]}" alt="" loading="lazy" decoding="async">`;
  return Object.prototype.hasOwnProperty.call(ILUSTRA, k) ? ILUSTRA[k] : null;
}

/* ══════════════════════════════════════════════════════════
   MOTOR DE «ESPAÑOL PARA…» · el curso al revés
   ══════════════════════════════════════════════════════════
   Los siete cursos enseñan un idioma a quien habla español. Este enseña
   español a quien habla uno de esos siete. Así Compañeros tiene gente a
   los dos lados: quien aprende tailandés y quien aprende español.

   Es un motor pequeño y aparte (el de los siete está escrito entero en
   castellano): interfaz en el idioma de quien aprende (UI, en
   es/ui-<idioma>.js), contenido de es/contenido-<idioma>.json y voz
   latinoamericana grabada (audio-es-mx). Lo arma es/build-es.js.

   Le presta a companeros.js lo que este espera del motor grande (S, go,
   VIEWS, aviso, diAlgo, perfilDatos…), así Compañeros es el mismo código
   en todos los cursos. */

/* ── estado ─────────────────────────────────────────────── */
const CLAVE = "suena-es-" + CURSO.id;
/* el selector (../espanol/) recuerda desde qué idioma aprende */
try{ localStorage.setItem("suena-es-elegido", CURSO.id); }catch(e){}
const S = (() => {
  const def = {xp:0, racha:{day:"", n:0}, dias:{}, temas:{}, lista:{}, diaria:{fecha:"", item:null, hecha:"", hechos:[]},
               nombre:"", perfil:{avatar:"zorro", foto:""}, speed:0.9, pest:{}};
  try{ return Object.assign(def, JSON.parse(localStorage.getItem(CLAVE) || "{}")); }catch(e){ return def; }
})();
const save = () => { try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} };
const EN_APP = location.hostname === "appassets.androidplatform.net";
const LANG = {id:CURSO.id, voz:CURSO.voz, nombre:CURSO.marca, secciones:[]};
const C = CONTENIDO;

/* ── utilidades ─────────────────────────────────────────── */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"})[c]);
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = s => document.querySelector(s);
function fechaLocal(t){ const d = t ? new Date(t) : new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
const marcaIdiomas = () => {};
let viewCleanup = null, current = "inicio";
let avTimer = null;
function aviso(e, t, x){
  let a = $("#aviso");
  if(!a){ a = document.createElement("div"); a.id = "aviso"; document.body.appendChild(a); }
  a.innerHTML = `<span class="av-e">${e}</span><span><b>${esc(t)}</b>${x ? `<em>${esc(x)}</em>` : ""}</span>`;
  a.className = "ver"; clearTimeout(avTimer); avTimer = setTimeout(() => a.className = "", 2600);
}
const vibra = ms => { try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} };
function celebra(){
  vibra([12, 60, 24]);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#FF5E3A", "#A855F7", "#22D3C5", "#FBBF24", "#F472B6"];
  for(let i = 0; i < 36; i++){
    const c = document.createElement("i"); c.className = "confeti";
    const ang = Math.random() * Math.PI * 2, f = 90 + Math.random() * 220;
    c.style.cssText = `left:${innerWidth / 2}px;top:${innerHeight / 3}px;background:${cols[i % 5]};--x:${Math.cos(ang) * f}px;--y:${Math.sin(ang) * f + 150}px`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 1400);
  }
}
const xpPara = n => 25 * n * (n + 1);
const nivelDe = xp => { let n = 0; while(xp >= xpPara(n + 1)) n++; return n; };
function ganaXP(n){
  if(!n) return;
  const antes = nivelDe(S.xp); S.xp += n; save();
  if(nivelDe(S.xp) > antes) setTimeout(() => { celebra(); aviso("🏅", UI.nuevo_nivel, UI.niveles[Math.min(nivelDe(S.xp), UI.niveles.length - 1)]); }, 300);
  pintaArriba();
}
function marcaDia(){ const d = fechaLocal(); if(!S.dias[d]){ S.dias[d] = 1; save(); } }
function cumpleRacha(){
  const d = fechaLocal(); if(S.racha.day === d) return;
  S.racha.n = S.racha.day === fechaLocal(Date.now() - 864e5) ? S.racha.n + 1 : 1; S.racha.day = d; save();
}
const rachaViva = () => (S.racha.day === fechaLocal() || S.racha.day === fechaLocal(Date.now() - 864e5)) ? S.racha.n : 0;

/* ── la voz ─────────────────────────────────────────────── */
const hayGrabado = t => !!(AUDIO && AUDIO[t]);
const reproductor = new Audio();
let turnoVoz = 0;
function diNativo(t, rate, a, fin, falla, lengua){
  try{ if(window.SuenaVoz && SuenaVoz.di(t, lengua || CURSO.voz, rate || S.speed, String(++turnoVoz))){ setTimeout(() => fin && fin(), 400 + t.length * 90); return true; } }catch(e){}
  return false;
}
function diAlgo(t, rate, alArrancar, alTerminar){
  t = String(t || "").trim(); if(!t) return;
  marcaDia();
  if(hayGrabado(t)){
    reproductor.onended = reproductor.onerror = null;
    /* en la app los siete cursos comparten una sola copia (espanol/audio) */
    reproductor.src = (window.Suena ? "../espanol/audio/" : "./audio/") + AUDIO[t];
    reproductor.playbackRate = Math.max(.5, Math.min(2, rate || S.speed));
    reproductor.onended = () => alTerminar && alTerminar();
    reproductor.onerror = () => alTerminar && alTerminar();
    reproductor.play().catch(() => alTerminar && alTerminar());
    return;
  }
  if(diNativo(t, rate, alArrancar, alTerminar)) return;
  try{
    const u = new SpeechSynthesisUtterance(t); u.lang = CURSO.voz; u.rate = rate || S.speed;
    u.onend = () => alTerminar && alTerminar(); speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ alTerminar && alTerminar(); }
}
const speak = (t, rate) => diAlgo(t, rate);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if(!b || e.target.closest("[data-no-say]")) return;
  diAlgo(b.dataset.say, b.dataset.lento ? .6 : S.speed);
  b.classList.remove("sonando"); void b.offsetWidth; b.classList.add("sonando");
});

/* ── los dibujos: los mismos que los cursos (dibujos.js y el arte hecho a mano) ── */
const sinArticulo = t => String(t).replace(/^(el|la|los|las|un|una)\s+/i, "");
function dibujoDe(it){
  const pruebas = [];
  if(it.glosa) pruebas.push(it.glosa.toLowerCase());
  pruebas.push(sinArticulo(it.es).toLowerCase(), it.es.toLowerCase());
  if(it.clave) pruebas.push(it.clave);
  for(const g of pruebas){
    for(const [frase, e] of DIBUJO_FRASES) if(g.indexOf(frase) >= 0) return ilustracion(frase) || e;
    for(const p of g.replace(/[¡!¿?().]/g, " ").split(/[\s\/,;-]+/).filter(Boolean)){
      const d = typeof ilustracion === "function" ? ilustracion(p) : null;
      if(d) return d;
      if(DIBUJO_PALABRAS[p]) return DIBUJO_PALABRAS[p];
    }
  }
  return DIBUJO_CATEGORIA[it.cat] || (it.cat === "cuerpo" ? "🧍" : it.cat === "numeros" ? "🔢" : "✨");
}

/* ── LA PALABRA DEL DÍA (escribirla cumple la racha) ─────── */
function ddPool(){
  const n = S.diaria.hechos.length;
  const cortas = C.palabras.filter(p => p.es.replace(/\s/g, "").length <= 7);
  const largas = C.palabras.filter(p => p.es.replace(/\s/g, "").length > 7);
  const frases = C.frases.filter(f => f.es.split(/\s+/).length <= 5);
  return n < 7 ? cortas : n < 14 ? largas.concat(cortas) : frases.concat(largas);
}
function ddHoy(){
  const hoy = fechaLocal();
  if(S.diaria.fecha === hoy && S.diaria.item) return S.diaria.item;
  const pool = ddPool(); let it = pool.find(p => S.diaria.hechos.indexOf(p.es) < 0) || pick(pool);
  S.diaria.fecha = hoy; S.diaria.item = {es:it.es, th:it.th, glosa:it.glosa || "", cat:it.cat || "", frase:!!it.catTh}; save();
  return S.diaria.item;
}
function ddBannerHTML(){
  const it = ddHoy(), hecha = S.diaria.hecha === fechaLocal();
  return `<div class="dd ${hecha ? "hecha" : ""}">
    <span class="dd-dib">${it.frase ? "💬" : dibujoDe(it)}</span>
    <div class="dd-tx"><small>${hecha ? "✓ " + UI.dd_hecha : "✍️ " + UI.dd_tit}</small>
      <b class="es" data-say="${esc(it.es)}">${esc(it.es)}</b><em>${esc(it.th)}</em></div>
    <button class="ib" data-say="${esc(it.es)}" aria-label="▶">▶</button>
    <button class="btn ${hecha ? "" : "btn-p"}" data-dd>${hecha ? UI.dd_repetir : UI.dd_escribe}</button>
  </div>`;
}
let dd = null;
function trozos(t, frase){ return frase ? t.split(/(\s+|[¿?¡!,.])/).filter(x => x !== "") : Array.from(t.toLowerCase()); }
const esTrozo = p => /[\p{L}\p{N}]/u.test(p);
function ddPaso(){
  const it = dd.it, piezas = trozos(it.es, it.frase), buenas = piezas.filter(esTrozo);
  const otras = it.frase ? shuffle(C.frases.flatMap(f => trozos(f.es, true).filter(esTrozo))).filter(p => buenas.indexOf(p) < 0).slice(0, 2)
                         : shuffle("aeioubcdfglmnprstvyzñ".split("")).filter(p => buenas.indexOf(p) < 0).slice(0, 3);
  dd.piezas = piezas; dd.puestas = 0; dd.fallos = 0;
  const modelo = dd.fase === "modelo";
  $("#modal").innerHTML = `<div class="caja pop"><button class="x" data-cierra>×</button>
    <small class="eti">✍️ ${modelo ? UI.dd_paso1 : UI.dd_paso2}</small>
    <div class="dd-cab"><span class="dib-m">${it.frase ? "💬" : dibujoDe(it)}</span><div><b class="tm-th">${esc(it.th)}</b></div>
      <button class="ib" data-say="${esc(it.es)}">▶</button></div>
    <div class="huecos ${it.frase ? "frase" : ""}" id="huecos">${piezas.map((p, k) => esTrozo(p)
      ? `<span class="hueco ${modelo ? "guia" : ""}" data-k="${k}">${modelo ? esc(p) : ""}</span>` : `<span class="sep">${esc(p)}</span>`).join("")}</div>
    <div class="fichas ${it.frase ? "frase" : ""}">${shuffle(buenas.concat(otras)).map(p => `<button class="ficha" data-ficha="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <div class="fb" id="ddFb">${modelo ? "" : `<button class="btn btn-s" data-pista>${UI.pista}</button>`}</div></div>`;
  $("#modal").hidden = false;
  setTimeout(() => diAlgo(it.es), 250);
}
function ddFalta(){ let n = 0; for(let k = 0; k < dd.piezas.length; k++){ if(!esTrozo(dd.piezas[k])) continue; if(n === dd.puestas) return k; n++; } return -1; }
function ddToca(b){
  const k = ddFalta(); if(k < 0) return;
  const h = document.querySelector(`#huecos [data-k="${k}"]`);
  if(b.dataset.ficha === dd.piezas[k]){
    h.textContent = dd.piezas[k]; h.classList.remove("guia"); h.classList.add("puesta"); b.disabled = true; b.classList.add("usada"); dd.puestas++; vibra(10);
    if(ddFalta() < 0) ddAcaba();
  } else { dd.fallos++; dd.limpia = false; b.classList.remove("mal"); void b.offsetWidth; b.classList.add("mal"); vibra([18, 40, 18]);
    if(dd.fallos >= 2 && !h.textContent){ h.textContent = dd.piezas[k]; h.classList.add("guia"); } }
}
function ddAcaba(){
  const fb = $("#ddFb"); diAlgo(dd.it.es);
  if(dd.fase === "modelo"){ fb.innerHTML = `<p class="ok">${UI.dd_bien}</p><button class="btn btn-p" data-dd-sig>${UI.dd_memoria}</button>`; return; }
  const primera = S.diaria.hecha !== fechaLocal();
  if(primera){ S.diaria.hecha = fechaLocal(); if(S.diaria.hechos.indexOf(dd.it.es) < 0) S.diaria.hechos.push(dd.it.es); cumpleRacha(); ganaXP(dd.limpia ? 25 : 15); save(); celebra(); }
  fb.innerHTML = `<p class="ok">${dd.limpia ? UI.dd_perfecta : UI.dd_hecho}</p>
    <p class="fuego">🔥 <b>${rachaViva()}</b> ${UI.dd_racha}</p><p class="nota">${UI.dd_cumplida}</p>
    <button class="btn btn-p" data-cierra>${UI.dd_seguir}</button>`;
}
document.addEventListener("click", e => {
  const t = e.target;
  if(t.closest("[data-dd]")){ dd = {it:ddHoy(), fase:"modelo", limpia:true}; ddPaso(); return; }
  if(!t.closest("#modal")) return;
  if(t.closest("[data-cierra]") || t.id === "modal"){ $("#modal").hidden = true; go(current, true); return; }
  const f = t.closest("[data-ficha]"); if(f && dd){ ddToca(f); return; }
  if(t.closest("[data-dd-sig]")){ dd.fase = "solo"; ddPaso(); return; }
  if(t.closest("[data-pista]")){ const k = ddFalta(); const h = k >= 0 && document.querySelector(`#huecos [data-k="${k}"]`); if(h){ h.textContent = dd.piezas[k]; h.classList.add("guia"); dd.limpia = false; } }

/* ── PALABRAS: temas en 4 pasos ─────────────────────────── */
const ORDEN = ["saludos", "personas", "cuerpo", "colores", "numeros", "comida", "casa", "tiempo", "naturaleza", "viajar", "compras", "salud", "básico"];
let lecCache = null;
function lecciones(){
  if(lecCache) return lecCache;
  const grupos = {};
  C.palabras.forEach(p => (grupos[p.cat] = grupos[p.cat] || []).push(p));
  grupos.cuerpo = C.cuerpo.map(c => Object.assign({cat:"cuerpo"}, c));
  grupos.numeros = C.numeros.map(n => ({es:n.es, th:String(n.n), cat:"numeros", num:n.n}));
  const fuera = [];
  for(const cat of ORDEN.concat(Object.keys(grupos).filter(k => ORDEN.indexOf(k) < 0))){
    const its = grupos[cat]; if(!its || its.length < 3) continue;
    const n = Math.max(1, Math.round(its.length / 7)), tam = Math.ceil(its.length / n);
    for(let i = 0; i < n; i++){
      const tr = its.slice(i * tam, (i + 1) * tam); if(!tr.length) continue;
      fuera.push({id:cat + "-" + (i + 1), cat, titulo:(UI.cat[cat] || cat) + (n > 1 ? " " + (i + 1) : ""), items:tr});
    }
  }
  return (lecCache = fuera);
}
const PASOS = [["conoce", UI.paso_conoce, "👀"], ["oye", UI.paso_oye, "👂"], ["lee", UI.paso_lee, "📖"], ["escribe", UI.paso_escribe, "✍️"]];
const prog = id => S.temas[id] || {};
const hecho = (id, p) => { const v = prog(id)[p] || 0; return p === "conoce" || p === "escribe" ? v >= 1 : v >= 70; };
const estrellas = id => PASOS.filter(([k]) => hecho(id, k)).length;
function apunta(id, p, v){ const x = S.temas[id] || (S.temas[id] = {}); x[p] = Math.max(x[p] || 0, v); save(); }
const dibujoIt = it => it.cat === "numeros" ? `<span class="num">${it.num}</span>` : dibujoDe(it);

let lec = null, paso = "conoce", idx = 0;
VIEWS.palabras = {

function pintaTemas(){

      <b>${esc(l.titulo)}</b><span class="estrellas">${PASOS.map(([k, , e]) => `<i class="${hecho(l.id, k) ? "si" : ""}">${e}</i>`).join("")}</span></button>`).join("")}</div>`;
    return;
  }

  ({conoce:pConoce, oye:() => pQuiz("oye"), lee:() => pQuiz("lee"), escribe:pEscribe})[paso]();

function abreTema(id){ go("palabras"); lec = lecciones().find(l => l.id === id); paso = (PASOS.find(([k]) => !hecho(id, k)) || PASOS[0])[0]; idx = 0; pintaTemas(); }
function sigPaso(){ const i = PASOS.findIndex(([k]) => k === paso); if(i < 3){ paso = PASOS[i + 1][0]; idx = 0; pintaTemas(); } else { const ls = lecciones(), j = ls.findIndex(l => l.id === lec.id); lec = ls[j + 1] || null; paso = "conoce"; idx = 0; pintaTemas(); } }
const finPaso = t => `<div class="fin pop"><div class="fin-e">🎉</div><p>${t}</p><button class="btn btn-p" data-sig-paso>${paso === "escribe" ? UI.siguiente_leccion : "→ " + UI.siguiente_paso}</button></div>`;

function pQuiz(modo){
  const its = lec.items, resto = lecciones().filter(l => l.id !== lec.id).flatMap(l => l.items);
  const total = Math.min(8, Math.max(5, its.length));
  let i = 0, bien = 0, orden = shuffle(its.slice());
  const caja = $("#tmCaja");
  const una = () => {
    if(i >= total){
      const pc = Math.round(bien / total * 100); apunta(lec.id, modo, pc);
      caja.innerHTML = `<div class="card centro"><small>${UI.resultado}</small><div class="pc">${pc}%</div><p>${bien} ${UI.de} ${total} ${UI.correctas}</p>
        <button class="btn" data-otra>${UI.otra_tanda}</button></div>${pc >= 70 ? finPaso(UI.paso_superado) : `<p class="nota">${UI.falta_70}</p>`}`;
      if(pc >= 80) celebra(); ganaXP(pc >= 80 ? 20 : 8);
      caja.querySelector("[data-otra]").onclick = () => pQuiz(modo);
      if(window.Suena && Suena.finDeLeccion) try{ Suena.finDeLeccion(); }catch(e){}
      return;
    }
    if(!orden.length) orden = shuffle(its.slice());
    const ok = orden.pop();
    const malas = shuffle(its.filter(x => x.es !== ok.es).concat(shuffle(resto).slice(0, 4))).filter((x, k, a) => a.findIndex(y => y.th === x.th) === k && x.th !== ok.th).slice(0, 3);
    const ops = shuffle([ok].concat(malas));
    caja.innerHTML = `<p class="nota">${modo === "oye" ? UI.oye_nota : UI.lee_nota}</p><div class="card quiz">
      <div class="qprog"><span>${i + 1} / ${total}</span><div class="bar"><i style="width:${i / total * 100}%"></i></div></div>
      ${modo === "oye" ? `<button class="btn btn-p grande" data-say="${esc(ok.es)}">▶</button>` : `<b class="es grande">${esc(ok.es)}</b>`}
      <p class="q">${modo === "oye" ? UI.q_que_oiste : UI.q_que_dice}</p>
      <div class="ops">${ops.map((o, k) => `<button class="op" data-op="${k}"><span class="dib-m">${dibujoIt(o)}</span><small>${esc(o.th)}</small></button>`).join("")}</div>
      <div class="fb" id="qfb"></div></div>`;
    if(modo === "oye") setTimeout(() => diAlgo(ok.es), 300);
    caja.querySelectorAll("[data-op]").forEach(b => b.onclick = () => {
      const o = ops[+b.dataset.op], acierto = o === ok;
      caja.querySelectorAll("[data-op]").forEach((x, k) => { x.disabled = true; if(ops[k] === ok) x.classList.add("ok"); else if(x === b) x.classList.add("no"); });
      if(acierto){ bien++; vibra(12); } else vibra([18, 40, 18]);
      diAlgo(ok.es);
      $("#qfb").innerHTML = `<b class="${acierto ? "okt" : "not"}">${acierto ? UI.correcto : UI.no_era}</b> — <span class="es">${esc(ok.es)}</span> · ${esc(ok.th)}
        <div><button class="btn btn-p" data-qsig>${UI.siguiente}</button></div>`;
      $("#qfb [data-qsig]").onclick = () => { i++; una(); };
    });
  };
  una();
}
let esc_ = null;
function pEscribe(){
  const lista = shuffle(lec.items.filter(it => it.es.replace(/\s/g, "").length <= 12)).slice(0, 5);
  esc_ = {lista, i:0, fase:"modelo", bien:0}; pEscPalabra();
}
function pEscPalabra(){
  const e = esc_, it = e.lista[e.i], piezas = Array.from(it.es.toLowerCase()), buenas = piezas.filter(esTrozo);
  const otras = shuffle("aeioubcdfglmnprstvyzñ".split("")).filter(p => buenas.indexOf(p) < 0).slice(0, 3);
  e.piezas = piezas; e.puestas = 0; e.fallos = 0;
  $("#tmCaja").innerHTML = `<div class="dd-cab"><span class="dib-m">${dibujoIt(it)}</span><div><b class="tm-th">${esc(it.th)}</b>
      <small class="fase">${e.fase === "modelo" ? UI.copia_modelo : UI.tu_solo}</small></div><button class="ib" data-say="${esc(it.es)}">▶</button></div>
    <div class="huecos" id="eHuecos">${piezas.map((p, k) => esTrozo(p) ? `<span class="hueco ${e.fase === "modelo" ? "guia" : ""}" data-k="${k}">${e.fase === "modelo" ? esc(p) : ""}</span>` : `<span class="sep">${esc(p)}</span>`).join("")}</div>
    <div class="fichas">${shuffle(buenas.concat(otras)).map(p => `<button class="ficha" data-eficha="${esc(p)}">${esc(p)}</button>`).join("")}</div><div class="fb" id="eFb"></div>`;
  setTimeout(() => diAlgo(it.es), 250);
}
function pEscToca(b){
  const e = esc_; let k = -1, n = 0;
  for(let j = 0; j < e.piezas.length; j++){ if(!esTrozo(e.piezas[j])) continue; if(n === e.puestas){ k = j; break; } n++; }
  if(k < 0) return;
  const h = document.querySelector(`#eHuecos [data-k="${k}"]`);
  if(b.dataset.eficha === e.piezas[k]){
    h.textContent = e.piezas[k]; h.classList.remove("guia"); h.classList.add("puesta"); b.disabled = true; b.classList.add("usada"); e.puestas++; vibra(10);
    if(e.puestas === e.piezas.filter(esTrozo).length){

async function cpBusca(){
  const db = cp.fb.db;
  try{
    const s = await db.collection("perfiles").where("nativo", "==", cp.perfil.aprende)
      .where("aprende", "==", cp.perfil.nativo).limit(40).get();
    const yaChat = new Set(cp.chats.map(cpOtroDe));
    cp.desc = s.docs.map(d => Object.assign({uid:d.id}, d.data()))
      .filter(p => p.uid !== cp.user.uid && !p.suspendido && !cpBloqueado(p.uid) && !yaChat.has(p.uid))
      .map(p => Object.assign(p, {_c:(p.intereses || []).filter(i => (cp.perfil.intereses || []).indexOf(i) >= 0).length}))
      .sort((a, b) => b._c - a._c || ((b.activo && b.activo.seconds) || 0) - ((a.activo && a.activo.seconds) || 0))
      .slice(0, 20);
  }catch(e){ cp.desc = []; }
  cp.descCargado = true;
  if(cp.pesta === "descubrir" && !cp.chat) cpPinta();
}

function cpAbreChat(){
  if(cp.subChat){ cp.subChat(); cp.subChat = null; }
  const db = cp.fb.db, id = cp.chat.id;
  cp.subChat = db.collection("chats").doc(id).collection("mensajes").orderBy("hora").limitToLast(200)
    .onSnapshot(s => {
      const ms = s.docs.map(d => Object.assign({id:d.id}, d.data()));
      const caja = document.getElementById("cpMsgs");
      if(!caja) return;
      caja.innerHTML = ms.length ? ms.map(cpMsgHTML).join("")
        : `<div class="cp-centro"><div class="cp-e">👋</div><p class="muted">${cpT("Empezad por saludaros. ¿Probáis con uno de los temas de abajo?")}</p></div>`;
      marcaIdiomas(caja);
      caja.scrollTop = caja.scrollHeight;
      const ult = ms[ms.length - 1];
      if(ult && ult.hora){
        /* lo leído se guarda en lo privado de cada uno: el chat no se toca */
        if(!cp.privado.leidos) cp.privado.leidos = {};
        cp.privado.leidos[id] = ult.hora.seconds;
        cp.fb.db.collection("privado").doc(cp.user.uid).set({leidos:{[id]:ult.hora.seconds}}, {merge:true}).catch(() => {});
      }
    }, () => { const c = document.getElementById("cpMsgs"); if(c) c.innerHTML = `<p class="muted">${cpT("No se pudieron cargar los mensajes.")}</p>`; });

/* traducir: lo hace el teléfono (Traductor.java) */
let cpTrN = 0; const cpTrCb = {};
window.__traduce = (id, r) => { const f = cpTrCb[id]; if(f){ delete cpTrCb[id]; f(r); } };
function cpTraduce(msgId){
  const caja = document.getElementById("cpTr-" + msgId);
  if(!caja) return;
  if(!caja.hidden){ caja.hidden = true; return; }
  caja.hidden = false; caja.textContent = cpT("Traduciendo… (la primera vez baja el idioma al teléfono)");
  const de = cpIdiomaDe(msgId), a = de === cp.perfil.nativo ? cp.perfil.aprende : cp.perfil.nativo;
  const id = "t" + (++cpTrN);
  cpTrCb[id] = r => { caja.textContent = r && r.ok ? r.texto : cpT("No se pudo traducir ahora."); };
  try{ SuenaTraduce.traduce(cpMsgDe(msgId), de, a, id); }catch(e){ caja.textContent = cpT("No se pudo traducir ahora."); }
}
function cpOir(msgId){
  const t = cpMsgDe(msgId), idi = cpIdiomaDe(msgId);
  if(idi === cpCodigo()){ diAlgo(t, S.speed); return; }
  if(typeof diNativo === "function" && window.SuenaVoz && diNativo(t, S.speed, null, null, null, idi === "es" ? "es-ES" : idi)) return;
  try{
    const u = new SpeechSynthesisUtterance(t); u.lang = idi; u.rate = S.speed || 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
async function cpCorrige(msgId){
  const orig = cpMsgDe(msgId);
  const nuevo = await cpPide(cpT("Corregir la frase"), cpT("Escribe cómo se diría mejor:"), orig);
  if(!nuevo || nuevo.trim() === orig.trim()) return;
  if(cpFiltra(nuevo)){ aviso("⚠️", cpFiltra(nuevo), ""); return; }
  try{
    await cp.fb.db.collection("chats").doc(cp.chat.id).collection("mensajes").doc(msgId)
      .update({correccion:{texto:nuevo.trim().slice(0, 600), por:cp.user.uid}});
  }catch(e){ aviso("⚠️", "No se pudo guardar la corrección", ""); }
}

const CP_MOTIVOS = [cpT("Acoso o insultos"), cpT("Contenido sexual"), cpT("Pide dinero o estafa"), cpT("Spam o publicidad"), cpT("Parece menor de edad"), cpT("Otro motivo")];
async function cpDenuncia(){
  const otro = cpOtroDe(cp.chat);
  const motivo = await cpElige(cpT("Denunciar a") + " " + (cp.otro && cp.otro.nombre || ""), cpT("¿Qué ha pasado? Lo revisamos en menos de 24 horas."), CP_MOTIVOS);
  if(!motivo) return;
  const detalle = (await cpPide(cpT("Cuéntanos un poco más"), cpT("Opcional. No hace falta copiar los mensajes: los últimos van con la denuncia."), "")) || "";
  const ultimos = [...document.querySelectorAll("#cpMsgs [data-cp-msg]")].slice(-10)
    .map(el => (el.classList.contains("mio") ? "yo: " : "otro: ") + (el.querySelector(".cp-burbuja") || {}).textContent).join("\n").slice(0, 3000);
  try{
    await cp.fb.db.collection("denuncias").add({de:cp.user.uid, contra:otro, chat:cp.chat.id, motivo, detalle:detalle.slice(0, 500),
      ultimos, hora:firebase.firestore.FieldValue.serverTimestamp()});
    aviso("🚩", cpT("Denuncia enviada"), cpT("Gracias por avisar"));
  }catch(e){ aviso("⚠️", cpT("No se pudo enviar la denuncia"), ""); return; }
  if(await cpConfirma(cpT("¿Bloquear también?"), cpT("No podrá volver a escribirte ni a saludarte."), cpT("Bloquear"))) cpBloquea(true);
}
async function cpBloquea(sinPreguntar){

  const otro = cpOtroDe(cp.chat), db = cp.fb.db;
  try{
    await db.collection("privado").doc(cp.user.uid).set({bloqueados:firebase.firestore.FieldValue.arrayUnion(otro)}, {merge:true});
    cp.privado.bloqueados = (cp.privado.bloqueados || []).concat(otro);
    await db.collection("chats").doc(cp.chat.id).update({cerradoPor:cp.user.uid});
    aviso("⛔", cpT("Bloqueado"), "");
  }catch(e){ aviso("⚠️", cpT("No se pudo bloquear"), ""); }
  cpCierraChat();
}
function cpCierraChat(){ if(cp.subChat){ cp.subChat(); cp.subChat = null; } cp.chat = null; cp.otro = null; cp.pesta = "chats"; cpPinta(); }

function cpCuentaHTML(){
  return `<div class="cp-modal-caja">
    <h3>${cpT("Tu cuenta de Compañeros")}</h3>
    <p class="muted">${esc(cp.user.email || "")}</p>
    <div class="cp-botones">
      <button class="btn" data-cp="editar">${cpT("✏️ Editar mi perfil")}</button>
      <button class="btn" data-cp="normas">${cpT("📜 Normas de la comunidad")}</button>
      <button class="btn" data-cp="sal">${cpT("🚪 Cerrar sesión")}</button>
      <button class="btn cp-peligro" data-cp="borra">${cpT("🗑️ Borrar mi cuenta")}</button>
    </div>
    <button class="btn btn--s" data-cp="cierramodal">${cpT("Cerrar")}</button></div>`;
}
async function cpBorraCuenta(){
  const ok = await cpPide(cpT("Borrar tu cuenta"), cpT("Se borran tu perfil, tus saludos y tus datos de Compañeros. Escribe BORRAR para confirmar."), "");
  if(!ok || ok.trim().toUpperCase() !== "BORRAR") return;
  const db = cp.fb.db, uid = cp.user.uid;
  try{
    const [a, b] = await Promise.all([db.collection("solicitudes").where("de", "==", uid).get(),
                                      db.collection("solicitudes").where("para", "==", uid).get()]);
    await Promise.all(a.docs.concat(b.docs).map(d => d.ref.delete().catch(() => {})));
    await db.collection("perfiles").doc(uid).delete();
    await db.collection("privado").doc(uid).delete();
    try{ await cp.fb.auth.currentUser.delete(); }
    catch(e){ /* Google pide haber entrado hace poco: se vuelve a entrar y se repite */
      if(e && e.code === "auth/requires-recent-login"){ aviso("🔐", cpT("Vuelve a entrar para terminar"), ""); await cpSal(); return; }
    }
    try{ if(window.SuenaCuenta) SuenaCuenta.salir(); }catch(e){}
    aviso("🗑️", cpT("Cuenta borrada"), cpT("Tus datos de Compañeros ya no están"));
    cpModalCierra();
  }catch(e){ aviso("⚠️", cpT("No se pudo borrar todo"), cpT("Vuelve a intentarlo")); }
}

/* ── ventanitas propias (los diálogos del navegador bloquean el WebView) ── */
function cpModal(html){
  let m = document.getElementById("cpModal");
  if(!m){ m = document.createElement("div"); m.id = "cpModal"; m.className = "dd-modal"; document.body.appendChild(m); }
  m.innerHTML = `<div class="dd-caja pop">${html}</div>`;
  m.hidden = false;
  return m;
}
function cpModalCierra(){ const m = document.getElementById("cpModal"); if(m) m.hidden = true; }
function cpPide(titulo, texto, valor){
  return new Promise(ok => {
    const m = cpModal(`<h3>${esc(titulo)}</h3><p class="muted">${esc(texto)}</p>
      <textarea class="cp-pide" rows="3" maxlength="600">${esc(valor || "")}</textarea>
      <div class="row" style="gap:8px;justify-content:flex-end;margin-top:10px">
        <button class="btn" data-r="no">${cpT("Cancelar")}</button><button class="btn btn--p" data-r="si">${cpT("Aceptar")}</button></div>`);
    const ta = m.querySelector("textarea"); setTimeout(() => ta.focus(), 50);
    m.onclick = e => { const r = e.target.closest("[data-r]"); if(!r) return; m.onclick = null; cpModalCierra(); ok(r.dataset.r === "si" ? ta.value : null); };
  });
}
function cpConfirma(titulo, texto, si){
  return new Promise(ok => {
    const m = cpModal(`<h3>${esc(titulo)}</h3><p class="muted">${esc(texto)}</p>
      <div class="row" style="gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="btn" data-r="no">${cpT("Cancelar")}</button><button class="btn btn--p" data-r="si">${esc(si)}</button></div>`);
    m.onclick = e => { const r = e.target.closest("[data-r]"); if(!r) return; m.onclick = null; cpModalCierra(); ok(r.dataset.r === "si"); };
  });
}
function cpElige(titulo, texto, ops){
  return new Promise(ok => {
    const m = cpModal(`<h3>${esc(titulo)}</h3><p class="muted">${esc(texto)}</p>
      <div class="cp-botones">${ops.map((o, i) => `<button class="btn" data-r="${i}">${esc(o)}</button>`).join("")}</div>
      <button class="btn btn--s" data-r="x" style="margin-top:10px">${cpT("Cancelar")}</button>`);
    m.onclick = e => { const r = e.target.closest("[data-r]"); if(!r) return; m.onclick = null; cpModalCierra(); ok(r.dataset.r === "x" ? null : ops[+r.dataset.r]); };
  });
}

/* el vídeo con premio (aspecto.js reparte el aviso) */
function cpPremio(que){
  if(que === "ganado" || que === "sinvideo"){
    const n = Math.min(CP_MAX_EXTRA, ((cp.privado && cp.privado.cupoExtra) || 0) + CP_POR_VIDEO);
    cp.privado.cupoExtra = n;
    cp.fb.db.collection("privado").doc(cp.user.uid).set({cupoExtra:n}, {merge:true}).catch(() => {});
    aviso("🎁", "+" + CP_POR_VIDEO + " compañeros", que === "ganado" ? cpT("Gracias por ver el vídeo") : cpT("Hoy no había vídeo: te lo regalamos"));
    cpPinta();
  } else aviso("🎬", cpT("Sin premio esta vez"), cpT("Hay que ver el vídeo hasta el final"));
}

      <div id="cpVista"></div>`;
  },
  init(){
    if(cp.fb && cp.user !== undefined && !cp.cargando){ cpPinta(); }
    else cpArranca();

document.addEventListener("submit", async e => {
  if(e.target.id === "cpEscribe"){ e.preventDefault(); cpEnvia(); return; }
  if(e.target.id !== "cpAlta") return;
  e.preventDefault();
  const f = e.target, err = document.getElementById("cpAltaErr");
  const ints = [...f.querySelectorAll("[name=int]:checked")].map(x => x.value).slice(0, 4);
  const d = {nombre:f.nombre.value.trim().slice(0, 30), nativo:f.nativo.value, aprende:f.aprende.value, nivel:f.nivel.value,
             intereses:ints, bio:f.bio.value.trim().slice(0, 200), mayorDeEdad:f.edad.checked, normas:f.normas.checked, suspendido:false};
  if(!d.nombre){ err.textContent = cpT("Escribe tu nombre."); return; }
  if(d.nativo === d.aprende){ err.textContent = cpT("El idioma que aprendes tiene que ser otro distinto al tuyo."); return; }
  if(!d.mayorDeEdad || !d.normas){ err.textContent = cpT("Para entrar hay que tener 18 años o más y aceptar las normas."); return; }
  if(cpFiltra(d.nombre + " " + d.bio)){ err.textContent = cpT("El nombre o la presentación no cumplen las normas (sin enlaces, teléfonos ni insultos)."); return; }
  const p = typeof perfilDatos === "function" ? perfilDatos() : {};
  if(p.foto && p.foto.length <= 60000) d.foto = p.foto; else if(p.avatar) d.avatar = p.avatar;
  d.creado = firebase.firestore.FieldValue.serverTimestamp();
  d.activo = d.creado;
  try{
    const editar = !!cp.perfil;
    if(editar) delete d.creado;
    await cp.fb.db.collection("perfiles").doc(cp.user.uid).set(d, {merge:true});
    if(!editar) await cp.fb.db.collection("privado").doc(cp.user.uid).set({bloqueados:[], cupoExtra:0}, {merge:true});
    cp.perfil = Object.assign({}, cp.perfil || {}, d);
    cp.descCargado = false; cp.desc = [];
    if(!editar) cpEscucha();
    cpPinta();
  }catch(ex){ err.textContent = cpT("No se pudo guardar. Revisa la conexión y vuelve a intentarlo."); }
});

document.addEventListener("click", async e => {
  const t = e.target;
  if(!t.closest("#cpVista, #cpModal")) return;
  const b = t.closest("[data-cp]");
  const acc = b && b.dataset.cp;
  if(acc === "entra"){ cpEntra(); return; }
  if(acc === "reintenta"){ cpArranca(); return; }
  if(acc === "sal"){ cpModalCierra(); cpSal(); return; }
  if(acc === "normas"){ cpModal(CP_NORMAS + `<button class="btn btn--p" data-cp="cierramodal" style="margin-top:12px">${cpT("Entendido")}</button>`); return; }
  if(acc === "cierramodal"){ cpModalCierra(); return; }
  if(acc === "cuenta"){ cpModal(cpCuentaHTML()); return; }
  if(acc === "editar"){ cpModalCierra(); const v = document.getElementById("cpVista"); v.innerHTML = cpAltaHTML(); return; }
  if(acc === "borra"){ cpModalCierra(); cpBorraCuenta(); return; }
  if(acc === "rebusca"){ cp.descCargado = false; cp.desc = []; cpPinta(); return; }
  if(acc === "vuelve"){ cpCierraChat(); return; }
  if(acc === "menuchat"){ const m = document.getElementById("cpMenu"); if(m) m.hidden = !m.hidden; return; }
  if(acc === "denuncia"){ cpDenuncia(); return; }
  if(acc === "bloquea"){ cpBloquea(); return; }
  if(acc === "premium"){ try{ if(window.Suena && Suena.suscribirse) Suena.suscribirse(); else go("inicio"); }catch(ex){} return; }
  if(acc === "video"){
    if(!(window.Suena && Suena.verVideo)){ cpPremio("sinvideo"); return; }
    let hay = false; try{ hay = Suena.hayVideo(); }catch(ex){}
    if(!hay){ cpPremio("sinvideo"); return; }
    window.__cpEsperaVideo = true; Suena.verVideo("cupocompaneros"); return;
  }
  if(acc === "idioma"){
    cpEscribeEn = cpEscribeEn === cp.perfil.aprende ? cp.perfil.nativo : cp.perfil.aprende;
    b.textContent = cpEscribeEn.toUpperCase();
    const ta = document.getElementById("cpTexto");
    if(ta) ta.placeholder = cpT("Escribe en") + " " + cpNombreIdioma(cpEscribeEn).toLowerCase() + "…";
    return;
  }
  const pe = t.closest("[data-cp-p]"); if(pe){ cp.pesta = pe.dataset.cpP; cpPinta(); return; }
  const sa = t.closest("[data-cp-saluda]"); if(sa){ sa.disabled = true; cpSaluda(sa.dataset.cpSaluda); return; }
  const ac = t.closest("[data-cp-acepta]"); if(ac){ ac.disabled = true; cpAcepta(ac.dataset.cpAcepta); return; }
  const re = t.closest("[data-cp-rechaza]"); if(re){ cp.fb.db.collection("solicitudes").doc(re.dataset.cpRechaza).update({estado:"rechazada", respondido:firebase.firestore.FieldValue.serverTimestamp()}).catch(() => {}); return; }
  const rt = t.closest("[data-cp-retira]"); if(rt){ cp.fb.db.collection("solicitudes").doc(rt.dataset.cpRetira).delete().catch(() => {}); return; }
  const ab = t.closest("[data-cp-abre]"); if(ab){ cp.chat = cp.chats.find(c => c.id === ab.dataset.cpAbre); cp.otro = cp.chat ? cp.perfilesCache[cpOtroDe(cp.chat)] : null; cpEscribeEn = null; cpPinta(); return; }
  const te = t.closest("[data-cp-tema]"); if(te){ const ta = document.getElementById("cpTexto"); if(ta){ ta.value = te.dataset.cpTema; ta.focus(); } return; }
  const oi = t.closest("[data-cp-oir]"); if(oi){ cpOir(oi.dataset.cpOir); return; }
  const tr = t.closest("[data-cp-trad]"); if(tr){ cpTraduce(tr.dataset.cpTrad); return; }
  const co = t.closest("[data-cp-corrige]"); if(co){ cpCorrige(co.dataset.cpCorrige); return; }
  const gu = t.closest("[data-cp-guarda]"); if(gu){ const x = cpMsgDe(gu.dataset.cpGuarda); if(x && !estaMarcada(x)) marcaCambia(x); aviso("⭐", cpT("Guardada en Tu lista"), ""); return; }
});
document.addEventListener("keydown", e => {
  if(e.target && e.target.id === "cpTexto" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); cpEnvia(); }
});
